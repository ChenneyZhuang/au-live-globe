# Cloudflare Pages configuration.
# Deploy: `npx wrangler pages deploy` (uses pages_build_output_dir below)
# or connect the repo in the Cloudflare dashboard with:
#   build command: npm run build
#   output directory: dist
# The functions/ directory is detected automatically; functions/api/qld-fires.js
# serves the same-origin /api/qld-fires proxy in production.
name = "au-live-globe"
